  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <link rel="canonical" href="https://www.sahara-express.com/" />
    <meta property="og:url" content="https://www.sahara-express.com/" />
    <meta property="og:title" content="Sahara Express - للسفر ونقل البضائع والكوليات" />
    <meta property="og:description" content="تطبيق Sahara Express لإدارة محطات النقل الدولي البري والإرساليات والتحويلات المالية والصناديق النقدية بين المغرب وموريتانيا." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#070B14" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sahara Express" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
      // Redirect any legacy .vercel.app URL (such as aymanlots-ma7ata-*.vercel.app) directly to the official domain
      (function() {
        try {
          var host = window.location.hostname || '';
          if (host.endsWith('.vercel.app')) {
            window.location.replace(
              'https://www.sahara-express.com' +
                window.location.pathname +
                window.location.search +
                window.location.hash
            );
            return;
          }
        } catch (err) {}
      })();

      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
      });
      // Immediately purge stale v8 service worker cache that cached dev .tsx modules
      if ('caches' in window) {
        caches.has('sahara-cache-v8').then(function(hasV8) {
          if (hasV8) {
            caches.delete('sahara-cache-v8').then(function() {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {
                    window.location.reload();
                  });
                });
              } else {
                window.location.reload();
              }
            });
          }
        }).catch(function() {});
      }
    </script>
  </head>
  <body class="font-['Cairo',sans-serif] antialiased select-none min-h-screen theme-dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
