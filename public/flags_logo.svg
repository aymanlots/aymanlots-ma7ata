<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160" width="460" height="160">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="mrClip">
      <rect x="10" y="10" width="200" height="140" rx="10" ry="10"/>
    </clipPath>
    <clipPath id="maClip">
      <rect x="250" y="10" width="200" height="140" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <!-- Left: Mauritania Flag -->
  <g filter="url(#shadow)">
    <g clip-path="url(#mrClip)">
      <rect x="10" y="10" width="200" height="140" fill="#006233"/>
      <rect x="10" y="10" width="200" height="28" fill="#D01C1F"/>
      <rect x="10" y="122" width="200" height="28" fill="#D01C1F"/>
      <!-- Crescent -->
      <path d="M 80 80 A 32 32 0 0 0 140 80 A 25 25 0 0 1 80 80 Z" fill="#FFC400"/>
      <!-- Star -->
      <polygon points="110,60 113,67 121,67 115,72 117,79 110,75 103,79 105,72 99,67 107,67" fill="#FFC400"/>
    </g>
    <rect x="10" y="10" width="200" height="140" rx="10" ry="10" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>
  </g>

  <!-- Right: Morocco Flag -->
  <g filter="url(#shadow)">
    <g clip-path="url(#maClip)">
      <rect x="250" y="10" width="200" height="140" fill="#C1272D"/>
      <!-- Pentagram Star -->
      <path d="M 350 42 L 372.3 110.7 L 313.9 68.3 L 386.1 68.3 L 327.7 110.7 Z" 
            fill="none" stroke="#006233" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="250" y="10" width="200" height="140" rx="10" ry="10" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>
  </g>

  <!-- Center Connection Symbol -->
  <circle cx="230" cy="80" r="10" fill="#D97706"/>
  <circle cx="230" cy="80" r="6" fill="#FDE68A"/>
</svg>
