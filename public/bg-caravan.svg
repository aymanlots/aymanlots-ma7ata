<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="caravanSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="30%" stop-color="#23121E"/>
      <stop offset="55%" stop-color="#5A1E14"/>
      <stop offset="75%" stop-color="#9A3412"/>
      <stop offset="88%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="caravanSun" cx="78%" cy="32%" r="28%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="1"/>
      <stop offset="20%" stop-color="#FEF08A" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#D97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9A3412" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="duneFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1E1322" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="duneMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#0E111B"/>
    </linearGradient>
    <linearGradient id="duneFore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26150C"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1600" height="900" fill="url(#caravanSky)"/>

  <!-- Blazing Desert Sun -->
  <circle cx="1250" cy="290" r="260" fill="url(#caravanSun)"/>
  <circle cx="1250" cy="290" r="35" fill="#FFFFFF" opacity="0.95"/>

  <!-- Soft Sunset Clouds -->
  <path d="M0 160 Q 400 120, 800 170 T 1600 140 L 1600 240 Q 1200 290, 700 230 T 0 250 Z" fill="#B45309" opacity="0.18" filter="blur(20px)"/>
  <path d="M0 240 Q 500 210, 1000 260 T 1600 220 L 1600 340 Q 1100 370, 600 320 T 0 330 Z" fill="#78350F" opacity="0.22" filter="blur(25px)"/>

  <!-- Background Sand Dunes -->
  <path d="M-50 420 Q 350 250, 700 380 T 1650 340 L 1650 900 L -50 900 Z" fill="url(#duneFar)"/>
  
  <!-- Midground Dunes Ridge -->
  <path d="M-50 490 Q 250 360, 650 470 T 1650 430 L 1650 900 L -50 900 Z" fill="url(#duneMid)"/>

  <!-- The Main Dune Ridge where the Caravan walks -->
  <path d="M-50 560 C 250 520, 500 505, 750 525 C 1050 550, 1350 530, 1650 580 L 1650 900 L -50 900 Z" fill="url(#duneFore)"/>

  <!-- Dust / Atmospheric Sand haze around caravan -->
  <ellipse cx="850" cy="520" rx="600" ry="80" fill="#F59E0B" opacity="0.15" filter="blur(30px)"/>

  <!-- ================= CAMEL CARAVAN SILHOUETTES ================= -->
  <!-- Caravan leader and Camels in single file walking towards left -->
  <g fill="#070B12" stroke="#070B12" stroke-width="1">
    <!-- Camel 1 (Lead) -->
    <g transform="translate(320, 480) scale(0.65)">
      <!-- Rider -->
      <circle cx="18" cy="-52" r="7"/>
      <path d="M12 -45 Q 16 -30 24 -15 L 8 -15 Q 12 -35 12 -45 Z"/>
      <!-- Camel Body -->
      <ellipse cx="10" cy="15" rx="35" ry="22"/>
      <!-- Hump -->
      <path d="M -5 0 Q 10 -30 25 0 Z"/>
      <!-- Neck & Head -->
      <path d="M -20 20 Q -45 5 -42 -25 Q -40 -45 -55 -45 Q -65 -45 -60 -38 Q -50 -35 -48 -20 Q -45 10 -25 30 Z"/>
      <!-- Ears -->
      <circle cx="-58" cy="-48" r="3"/>
      <!-- Tail -->
      <path d="M 42 15 Q 52 35 48 50" stroke-width="2.5" fill="none"/>
      <!-- Legs -->
      <path d="M -15 32 L -25 75 L -35 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -5 32 L 8 70 L 15 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 20 32 L 32 75 L 45 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 35 32 L 20 75 L 10 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Camel 2 -->
    <g transform="translate(480, 475) scale(0.68)">
      <circle cx="18" cy="-52" r="7"/>
      <path d="M12 -45 Q 16 -30 24 -15 L 8 -15 Q 12 -35 12 -45 Z"/>
      <ellipse cx="10" cy="15" rx="35" ry="22"/>
      <path d="M -5 0 Q 10 -30 25 0 Z"/>
      <path d="M -20 20 Q -45 5 -42 -25 Q -40 -45 -55 -45 Q -65 -45 -60 -38 Q -50 -35 -48 -20 Q -45 10 -25 30 Z"/>
      <path d="M 42 15 Q 52 35 48 50" stroke-width="2.5" fill="none"/>
      <path d="M -15 32 L -10 75 L -20 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -5 32 L -18 70 L -10 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 20 32 L 15 75 L 25 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 35 32 L 40 75 L 50 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Lead rope between 1 and 2 -->
    <path d="M 350 495 Q 410 520 445 490" stroke="#070B12" stroke-width="1.5" fill="none"/>

    <!-- Camel 3 -->
    <g transform="translate(640, 480) scale(0.65)">
      <circle cx="18" cy="-52" r="7"/>
      <path d="M12 -45 Q 16 -30 24 -15 L 8 -15 Q 12 -35 12 -45 Z"/>
      <ellipse cx="10" cy="15" rx="35" ry="22"/>
      <path d="M -5 0 Q 10 -30 25 0 Z"/>
      <path d="M -20 20 Q -45 5 -42 -25 Q -40 -45 -55 -45 Q -65 -45 -60 -38 Q -50 -35 -48 -20 Q -45 10 -25 30 Z"/>
      <path d="M 42 15 Q 52 35 48 50" stroke-width="2.5" fill="none"/>
      <path d="M -15 32 L -25 75 L -35 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -5 32 L 8 70 L 15 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 20 32 L 32 75 L 45 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 35 32 L 20 75 L 10 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M 510 495 Q 570 520 605 495" stroke="#070B12" stroke-width="1.5" fill="none"/>

    <!-- Camel 4 -->
    <g transform="translate(790, 478) scale(0.67)">
      <circle cx="18" cy="-52" r="7"/>
      <path d="M12 -45 Q 16 -30 24 -15 L 8 -15 Q 12 -35 12 -45 Z"/>
      <ellipse cx="10" cy="15" rx="35" ry="22"/>
      <path d="M -5 0 Q 10 -30 25 0 Z"/>
      <path d="M -20 20 Q -45 5 -42 -25 Q -40 -45 -55 -45 Q -65 -45 -60 -38 Q -50 -35 -48 -20 Q -45 10 -25 30 Z"/>
      <path d="M 42 15 Q 52 35 48 50" stroke-width="2.5" fill="none"/>
      <path d="M -15 32 L -10 75 L -20 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -5 32 L -18 70 L -10 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 20 32 L 15 75 L 25 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 35 32 L 40 75 L 50 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M 670 495 Q 730 520 755 495" stroke="#070B12" stroke-width="1.5" fill="none"/>

    <!-- Camel 5 -->
    <g transform="translate(930, 482) scale(0.64)">
      <circle cx="18" cy="-52" r="7"/>
      <path d="M12 -45 Q 16 -30 24 -15 L 8 -15 Q 12 -35 12 -45 Z"/>
      <ellipse cx="10" cy="15" rx="35" ry="22"/>
      <path d="M -5 0 Q 10 -30 25 0 Z"/>
      <path d="M -20 20 Q -45 5 -42 -25 Q -40 -45 -55 -45 Q -65 -45 -60 -38 Q -50 -35 -48 -20 Q -45 10 -25 30 Z"/>
      <path d="M 42 15 Q 52 35 48 50" stroke-width="2.5" fill="none"/>
      <path d="M -15 32 L -25 75 L -35 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -5 32 L 8 70 L 15 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 20 32 L 32 75 L 45 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 35 32 L 20 75 L 10 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M 820 495 Q 875 520 895 498" stroke="#070B12" stroke-width="1.5" fill="none"/>

    <!-- Camel 6 -->
    <g transform="translate(1070, 485) scale(0.63)">
      <circle cx="18" cy="-52" r="7"/>
      <path d="M12 -45 Q 16 -30 24 -15 L 8 -15 Q 12 -35 12 -45 Z"/>
      <ellipse cx="10" cy="15" rx="35" ry="22"/>
      <path d="M -5 0 Q 10 -30 25 0 Z"/>
      <path d="M -20 20 Q -45 5 -42 -25 Q -40 -45 -55 -45 Q -65 -45 -60 -38 Q -50 -35 -48 -20 Q -45 10 -25 30 Z"/>
      <path d="M 42 15 Q 52 35 48 50" stroke-width="2.5" fill="none"/>
      <path d="M -15 32 L -10 75 L -20 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M -5 32 L -18 70 L -10 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 20 32 L 15 75 L 25 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 35 32 L 40 75 L 50 125" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M 960 500 Q 1010 525 1035 500" stroke="#070B12" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Foreground rippling dune with sand grass -->
  <path d="M-20 680 Q 400 620, 850 670 T 1620 640 L 1620 900 L -20 900 Z" fill="#05080F" opacity="0.95"/>
  <!-- Dune highlights / sand wave lines -->
  <path d="M 0 690 Q 450 650 900 695" stroke="#D97706" stroke-width="1" opacity="0.2" fill="none"/>
  <path d="M 200 730 Q 750 690 1300 740" stroke="#D97706" stroke-width="0.8" opacity="0.15" fill="none"/>
</svg>